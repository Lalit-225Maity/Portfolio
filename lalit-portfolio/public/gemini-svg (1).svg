<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Dynamic Cyberpunk Gradient -->
    <linearGradient id="cyber-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff0844"/>
      <stop offset="100%" stop-color="#ffb199"/>
    </linearGradient>

    <!-- Deep Shadow -->
    <filter id="glow-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#00f2fe" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    .name { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 28px; fill: #ffffff; letter-spacing: 3px; }
    .role { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 600; font-size: 12px; fill: #00f2fe; letter-spacing: 5px; }
  </style>

  <!-- Dark Canvas Background -->
  <rect width="500" height="500" fill="#0b0f19"/>

  <!-- Logo Mark -->
  <g transform="translate(250, 200)" filter="url(#glow-shadow)">
    <!-- Hexagon Frame Background -->
    <polygon points="0,-85 73,-42 73,42 0,85 -73,42 -73,-42" fill="#151c2c" stroke="#2a364f" stroke-width="3"/>
    
    <!-- Left Code Bracket `<` -->
    <path d="M-25 -35 L-55 0 L-25 35" fill="none" stroke="url(#cyber-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Right Code Bracket `>` -->
    <path d="M25 -35 L55 0 L25 35" fill="none" stroke="url(#cyber-grad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Center Slash / Initial 'J' -->
    <path d="M12 -40 L-8 25 C-12 38 -25 38 -30 32" fill="none" stroke="url(#accent-orange)" stroke-width="7" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="250" y="370" class="name" text-anchor="middle">JOHN <tspan fill="url(#cyber-grad)">DOE</tspan></text>
  <text x="252" y="398" class="role" text-anchor="middle">SOFTWARE ENGINEER</text>
</svg>
